<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Locket Tqd</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--gold:#f5c518;--gold-light:#ffe566;--bg:#0a0a0f;--bg-glass:rgba(255,255,255,.08);--border:rgba(255,255,255,.12);--text:#f5f5f7;--muted:#a1a1aa;--danger:#ef4444;--success:#22c55e}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.bg-orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;animation:float 18s ease-in-out infinite}
.orb-1{width:420px;height:420px;background:radial-gradient(circle,#f5c518,transparent 70%);top:-10%;left:-10%}
.orb-2{width:360px;height:360px;background:radial-gradient(circle,#8b5cf6,transparent 70%);bottom:-15%;right:-10%;animation-delay:-6s}
@keyframes float{0%,100%{transform:translate(0,0)}33%{transform:translate(40px,-50px)}66%{transform:translate(-30px,30px)}}
.app{position:relative;z-index:1;max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;flex:1;padding:20px 18px 90px}.screen.active{display:flex}
#login-screen{justify-content:center;align-items:center;text-align:center}
.logo{width:100px;height:100px;border-radius:28px;background:linear-gradient(135deg,var(--gold-light),var(--gold));display:flex;align-items:center;justify-content:center;font-size:48px;margin:0 auto 16px;box-shadow:0 0 50px rgba(245,197,24,.4)}
.brand{font-size:28px;font-weight:800;background:linear-gradient(90deg,#fff,var(--gold-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tagline{color:var(--muted);font-size:13px;margin-top:4px}
.login-card{width:100%;background:var(--bg-glass);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:24px;padding:24px;margin-top:20px}
.form-group{margin-bottom:14px;text-align:left}
label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase}
input,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.35);color:var(--text);font-size:15px;outline:none;font-family:inherit}
textarea{min-height:72px;resize:none}
.btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#1a1a00}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.btn-ghost{background:var(--bg-glass);color:var(--text);border:1px solid var(--border)}
.btn-sm{width:auto;padding:8px 12px;font-size:13px;border-radius:10px}
.error-msg{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
.header{display:flex;align-items:center;justify-content:space-between;padding:8px 0 16px}
.header h1{font-size:20px;font-weight:800}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(10,10,15,.9);backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px 6px 20px;z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;padding:6px 12px;border-radius:12px}
.nav-item .icon{font-size:20px}.nav-item.active{color:var(--gold);background:rgba(245,197,24,.12)}
.card{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
.moment-card{padding:0;overflow:hidden}
.moment-img-wrap{aspect-ratio:1;background:#111}.moment-img-wrap img{width:100%;height:100%;object-fit:cover}
.moment-meta{padding:12px 14px;display:flex;align-items:center;gap:10px}
.moment-user{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.moment-user img,.avatar-placeholder{width:34px;height:34px;border-radius:50%;object-fit:cover}
.avatar-placeholder{background:linear-gradient(135deg,var(--gold),#8b5cf6);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff}
.name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caption{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.react-btn{background:rgba(255,255,255,.08);border:1px solid var(--border);border-radius:50%;width:38px;height:38px;font-size:16px;cursor:pointer}
.friends-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.friend-item{text-align:center;padding:10px 4px;border-radius:14px}
.friend-item img,.friend-item .avatar-placeholder{width:56px;height:56px;border-radius:50%;margin:0 auto 6px;object-fit:cover}
.profile-hero{text-align:center;padding:20px 0}
.profile-avatar{width:90px;height:90px;border-radius:50%;border:3px solid var(--gold);object-fit:cover;margin:0 auto 12px}
.profile-name{font-size:20px;font-weight:800}.profile-username{color:var(--muted);font-size:13px}
.post-preview{width:100%;aspect-ratio:1;border-radius:18px;background:rgba(0,0,0,.4);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:14px;cursor:pointer;position:relative}
.post-preview img,.post-preview video{width:100%;height:100%;object-fit:cover}
.post-preview .placeholder{text-align:center;color:var(--muted);font-size:13px}
.post-preview .placeholder span{font-size:36px;display:block;margin-bottom:6px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;margin:12px 0;font-size:14px}
.toggle{width:46px;height:26px;background:rgba(255,255,255,.15);border-radius:13px;position:relative;cursor:pointer}
.toggle.on{background:var(--gold)}
.toggle::after{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s}
.toggle.on::after{transform:translateX(20px)}
.chat-list-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;cursor:pointer}
.chat-list-item img,.chat-list-item .avatar-placeholder{width:44px;height:44px;border-radius:50%;object-fit:cover}
.loader{display:flex;justify-content:center;padding:36px}
.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:40px 16px;color:var(--muted)}.empty-state .icon{font-size:40px;margin-bottom:10px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120px);background:rgba(20,20,30,.95);border:1px solid var(--border);color:var(--text);padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:999;transition:.35s;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}.toast.success{border-color:var(--success)}.toast.error{border-color:var(--danger)}
.search-bar{display:flex;gap:8px;margin-bottom:14px}.search-bar input{flex:1}
</style>
</head>
<body>
<div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
<div class="app">
<div id="login-screen" class="screen active">
<div class="logo">💛</div><div class="brand">Locket Tqd</div><div class="tagline">Auto compress H.265 · locketlam</div>
<div class="login-card">
<div class="form-group"><label>Email</label><input type="email" id="email" placeholder="email@gmail.com"/></div>
<div class="form-group"><label>Mật khẩu</label><input type="password" id="password" placeholder="••••••••"/></div>
<button class="btn btn-primary" id="login-btn" onclick="doLogin()"><span id="login-btn-text">Đăng nhập</span></button>
<div class="error-msg" id="login-error"></div>
</div></div>
<div id="feed-screen" class="screen"><div class="header"><h1>💛 Feed</h1><button class="btn btn-ghost btn-sm" onclick="loadFeed()">↻</button></div><div id="feed-content"><div class="loader"><div class="spinner"></div></div></div></div>
<div id="friends-screen" class="screen"><div class="header"><h1>Bạn bè</h1></div><div class="search-bar"><input id="friend-search" placeholder="Tìm username..."/><button class="btn btn-primary btn-sm" onclick="searchUser()">Tìm</button></div><div id="friends-content"><div class="loader"><div class="spinner"></div></div></div></div>
<div id="post-screen" class="screen"><div class="header"><h1>Đăng Moment</h1></div>
<div class="post-preview" id="post-preview" onclick="document.getElementById('file-input').click()"><div class="placeholder"><span>📷</span>Chạm chọn ảnh / video<br><small style="opacity:.7">Video sẽ tự nén nếu &gt; 6 MB</small></div></div>
<input type="file" id="file-input" accept="image/*,video/*" hidden onchange="previewFile(this)"/>
<div class="form-group"><label>Caption</label><textarea id="caption" placeholder="Viết gì đó..."></textarea></div>
<div class="toggle-row"><span>Chỉ mình tôi</span><div class="toggle" id="private-toggle" onclick="this.classList.toggle('on')"></div></div>
<button class="btn btn-primary" id="post-btn" onclick="doPost()"><span id="post-btn-text">Đăng ngay</span></button>
</div>
<div id="chat-screen" class="screen"><div class="header"><h1>Chat</h1><button class="btn btn-ghost btn-sm" onclick="loadConversations()">↻</button></div><div id="chat-content"><div class="loader"><div class="spinner"></div></div></div></div>
<div id="profile-screen" class="screen"><div class="header"><h1>Hồ sơ</h1><button class="btn btn-ghost btn-sm" onclick="doLogout()">Đăng xuất</button></div><div id="profile-content"><div class="loader"><div class="spinner"></div></div></div></div>
<nav class="bottom-nav" id="bottom-nav" style="display:none">
<button class="nav-item active" data-screen="feed" onclick="showScreen('feed')"><span class="icon">🏠</span>Feed</button>
<button class="nav-item" data-screen="friends" onclick="showScreen('friends')"><span class="icon">👥</span>Bạn</button>
<button class="nav-item" data-screen="post" onclick="showScreen('post')"><span class="icon">➕</span>Đăng</button>
<button class="nav-item" data-screen="chat" onclick="showScreen('chat')"><span class="icon">💬</span>Chat</button>
<button class="nav-item" data-screen="profile" onclick="showScreen('profile')"><span class="icon">👤</span>Tôi</button>
</nav></div>
<div class="toast" id="toast"></div>
<script>
const API='';let currentUser=null,selectedFile=null;
function toast(msg,type=''){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show '+type;setTimeout(()=>el.classList.remove('show'),3200)}
function avatarHtml(url,name){if(url)return `<img src="${url}" alt="" onerror="this.outerHTML=avatarPlaceholder('${(name||'?').replace(/'/g,'')}')"/>`;return avatarPlaceholder(name||'?')}
function avatarPlaceholder(name){return `<div class="avatar-placeholder">${(name||'?')[0].toUpperCase()}</div>`}
async function api(path,opts={}){const res=await fetch(API+path,{credentials:'include',headers:opts.body instanceof FormData?undefined:{'Content-Type':'application/json'},...opts});const data=await res.json().catch(()=>({}));if(!res.ok&&res.status===401){showLogin();throw new Error(data.error||'Unauthorized')}return data}
function showScreen(name){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(name+'-screen').classList.add('active');document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.screen===name));if(name==='feed')loadFeed();if(name==='friends')loadFriends();if(name==='chat')loadConversations();if(name==='profile')loadProfile()}
function showLogin(){document.getElementById('bottom-nav').style.display='none';document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('login-screen').classList.add('active')}
function showApp(){document.getElementById('bottom-nav').style.display='flex';showScreen('feed')}
async function checkAuth(){try{const data=await api('/api/status');if(data.authenticated){currentUser=data;showApp()}else showLogin()}catch{showLogin()}}
async function doLogin(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,errEl=document.getElementById('login-error'),btn=document.getElementById('login-btn'),btnText=document.getElementById('login-btn-text');if(!email||!password){errEl.textContent='Nhập email và mật khẩu';return}btn.disabled=true;btnText.textContent='Đang đăng nhập...';errEl.textContent='';try{const data=await api('/api/login',{method:'POST',body:JSON.stringify({email,password})});if(data.ok){currentUser=data;toast('Đăng nhập thành công!','success');showApp()}else errEl.textContent=data.error||'Thất bại'}catch(e){errEl.textContent=e.message||'Lỗi'}finally{btn.disabled=false;btnText.textContent='Đăng nhập'}}
async function doLogout(){await api('/api/logout',{method:'POST'});currentUser=null;showLogin();toast('Đã đăng xuất')}
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=String(s);return d.innerHTML}
async function loadFeed(){const el=document.getElementById('feed-content');el.innerHTML='<div class="loader"><div class="spinner"></div></div>';try{const data=await api('/api/feed');if(!data.ok)throw new Error(data.error);const posts=data.posts||[];if(!posts.length){el.innerHTML='<div class="empty-state"><div class="icon">📸</div><p>Chưa có moment</p></div>';return}el.innerHTML=posts.map(p=>{const user=p.user||p.owner||{},name=user.first_name||user.username||'User',avatar=user.profile_picture_url||user.avatar||'',thumb=p.thumbnail_url||p.image_url||p.photo_url||'',caption=p.caption||p.note||'',uid=p.moment_uid||p.canonical_uid||p.uid||'';return `<div class="card moment-card"><div class="moment-img-wrap">${thumb?`<img src="${thumb}" loading="lazy"/>`:'<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:36px">📷</div>'}</div><div class="moment-meta"><div class="moment-user">${avatarHtml(avatar,name)}<div><div class="name">${esc(name)}</div><div class="caption">${esc(caption)}</div></div></div><button class="react-btn" onclick="reactMoment('${uid}')">❤️</button></div></div>`}).join('')}catch(e){el.innerHTML=`<div class="empty-state"><div class="icon">⚠️</div><p>${esc(e.message)}</p></div>`}}
async function reactMoment(uid){if(!uid)return;try{await api('/api/moments/react',{method:'POST',body:JSON.stringify({moment_uid:uid,reaction:'❤️'})});toast('Đã thả ❤️','success')}catch(e){toast(e.message,'error')}}
async function loadFriends(){const el=document.getElementById('friends-content');el.innerHTML='<div class="loader"><div class="spinner"></div></div>';try{const data=await api('/api/friends');if(!data.ok)throw new Error(data.error);const friends=data.friends||[];if(!friends.length){el.innerHTML='<div class="empty-state"><div class="icon">👥</div><p>Chưa có bạn</p></div>';return}el.innerHTML='<div class="friends-grid">'+friends.map(f=>{const name=f.first_name||f.username||'?',avatar=f.profile_picture_url||f.avatar||'';return `<div class="friend-item">${avatarHtml(avatar,name)}<div class="name">${esc(name)}</div></div>`}).join('')+'</div>'}catch(e){el.innerHTML=`<div class="empty-state"><p>${esc(e.message)}</p></div>`}}
async function searchUser(){const username=document.getElementById('friend-search').value.trim().replace('@','');if(!username)return toast('Nhập username','error');try{const data=await api('/api/profile/username/'+encodeURIComponent(username));if(data.ok&&data.profile){toast('Tìm thấy: '+(data.profile.first_name||username),'success');if(confirm('Gửi lời mời @'+username+'?')){const r=await api('/api/friends/request',{method:'POST',body:JSON.stringify({username})});toast(r.ok?'Đã gửi!':(r.error||'Lỗi'),r.ok?'success':'error')}}else toast(data.error||'Không tìm thấy','error')}catch(e){toast(e.message,'error')}}
function previewFile(input){const file=input.files[0];if(!file)return;selectedFile=file;const preview=document.getElementById('post-preview'),url=URL.createObjectURL(file),sizeMB=(file.size/(1024*1024)).toFixed(1);if(file.type.startsWith('video/')){const warn=file.size>=6*1024*1024?`<div style="position:absolute;bottom:8px;left:8px;right:8px;background:rgba(245,197,24,.9);color:#111;padding:6px 10px;border-radius:10px;font-size:12px;text-align:center">📀 ${sizeMB} MB — sẽ tự nén H.265</div>`:`<div style="position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;padding:4px 10px;border-radius:8px;font-size:12px">${sizeMB} MB</div>`;preview.innerHTML=`<div style="position:relative;width:100%;height:100%"><video src="${url}" controls style="width:100%;height:100%;object-fit:cover"></video>${warn}</div>`}else preview.innerHTML=`<img src="${url}" alt="preview"/>`}
async function doPost(){if(!selectedFile)return toast('Chọn ảnh/video','error');const isVideo=selectedFile.type.startsWith('video/'),sizeMB=selectedFile.size/(1024*1024);if(isVideo&&selectedFile.size>=6*1024*1024)toast('Video '+sizeMB.toFixed(1)+' MB — đang tự nén H.265...','');const btn=document.getElementById('post-btn'),btnText=document.getElementById('post-btn-text');btn.disabled=true;btnText.textContent=isVideo?(sizeMB>=6?'Đang nén H.265 & upload...':'Đang upload video...'):'Đang đăng...';const form=new FormData();if(isVideo)form.append('video',selectedFile);else form.append('image',selectedFile);form.append('caption',document.getElementById('caption').value);form.append('is_private',document.getElementById('private-toggle').classList.contains('on')?'true':'false');form.append('priority','balanced');const controller=new AbortController();const timeoutId=setTimeout(()=>controller.abort(),isVideo?300000:60000);try{const res=await fetch(API+'/api/moments/post',{method:'POST',body:form,credentials:'include',signal:controller.signal});clearTimeout(timeoutId);const data=await res.json().catch(()=>({}));if(res.status===401){showLogin();throw new Error(data.error||'Chưa đăng nhập')}if(data.ok){toast('Đăng thành công!'+(data.original_size_mb?' (gốc '+data.original_size_mb+' MB)':''),'success');selectedFile=null;document.getElementById('caption').value='';document.getElementById('post-preview').innerHTML='<div class="placeholder"><span>📷</span>Chạm chọn ảnh / video<br><small style="opacity:.7">Video sẽ tự nén nếu &gt; 6 MB</small></div>';document.getElementById('file-input').value='';showScreen('feed')}else toast(data.error||'Đăng thất bại','error')}catch(e){clearTimeout(timeoutId);if(e.name==='AbortError')toast('Hết thời gian (nén/upload lâu). Thử video ngắn hơn.','error');else toast(e.message||'Lỗi','error')}finally{btn.disabled=false;btnText.textContent='Đăng ngay'}}
async function loadConversations(){const el=document.getElementById('chat-content');el.innerHTML='<div class="loader"><div class="spinner"></div></div>';try{const data=await api('/api/chat/conversations');if(!data.ok)throw new Error(data.error);const convs=data.conversations||[];if(!convs.length){el.innerHTML='<div class="empty-state"><div class="icon">💬</div><p>Chưa có chat</p></div>';return}el.innerHTML=convs.map(c=>{const peer=c.other_user||c.peer||c.user||{},name=peer.first_name||peer.username||c.other_user_id||'User',avatar=peer.profile_picture_url||peer.avatar||'',snippet=(c.last_message&&(c.last_message.text||c.last_message.body))||c.snippet||'';return `<div class="chat-list-item">${avatarHtml(avatar,name)}<div><div class="name">${esc(name)}</div><div class="caption">${esc(snippet)}</div></div></div>`}).join('')}catch(e){el.innerHTML=`<div class="empty-state"><p>${esc(e.message)}</p></div>`}}
async function loadProfile(){const el=document.getElementById('profile-content');el.innerHTML='<div class="loader"><div class="spinner"></div></div>';try{const data=await api('/api/profile');if(!data.ok)throw new Error(data.error);const p=data.profile||{},name=[p.first_name,p.last_name].filter(Boolean).join(' ')||p.username||'Bạn',avatar=p.profile_picture_url||p.avatar||'';el.innerHTML=`<div class="profile-hero">${avatar?`<img src="${avatar}" class="profile-avatar"/>`:`<div class="profile-avatar" style="display:flex;align-items:center;justify-content:center;font-size:36px;background:linear-gradient(135deg,var(--gold),#8b5cf6)">${(name[0]||'?').toUpperCase()}</div>`}<div class="profile-name">${esc(name)}</div><div class="profile-username">@${esc(p.username||'—')}</div></div><div class="card" style="font-size:13px;color:var(--muted)"><div>UID: ${esc(p.uid||currentUser&&currentUser.uid||'—')}</div><div>Email: ${esc(currentUser&&currentUser.email||'—')}</div></div>`}catch(e){el.innerHTML=`<div class="empty-state"><p>${esc(e.message)}</p></div>`}}
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
checkAuth();
</script>
</body>
</html>
