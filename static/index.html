<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Locket Tqd</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #f5c518;
      --gold-light: #ffe566;
      --gold-dark: #c9a00a;
      --bg: #0a0a0f;
      --bg-card: rgba(255, 255, 255, 0.06);
      --bg-glass: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f5f5f7;
      --text-muted: #a1a1aa;
      --success: #22c55e;
      --danger: #ef4444;
      --radius: 20px;
      --shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Animated background */
    .bg-orbs {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: float 18s ease-in-out infinite;
    }
    .orb-1 {
      width: 420px; height: 420px;
      background: radial-gradient(circle, #f5c518 0%, transparent 70%);
      top: -10%; left: -10%;
      animation-delay: 0s;
    }
    .orb-2 {
      width: 360px; height: 360px;
      background: radial-gradient(circle, #8b5cf6 0%, transparent 70%);
      bottom: -15%; right: -10%;
      animation-delay: -6s;
    }
    .orb-3 {
      width: 280px; height: 280px;
      background: radial-gradient(circle, #ec4899 0%, transparent 70%);
      top: 40%; left: 50%;
      animation-delay: -12s;
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -50px) scale(1.08); }
      66% { transform: translate(-30px, 30px) scale(0.95); }
    }

    /* App shell */
    .app {
      position: relative;
      z-index: 1;
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Screens */
    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      padding: 20px 18px 90px;
      animation: fadeUp 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .screen.active { display: flex; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Login */
    #login-screen {
      justify-content: center;
      align-items: center;
      text-align: center;
      padding-bottom: 40px;
    }
    .logo-wrap {
      margin-bottom: 40px;
      position: relative;
    }
    .logo {
      width: 110px;
      height: 110px;
      border-radius: 32px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
      box-shadow: 0 0 60px rgba(245, 197, 24, 0.45), 0 20px 40px rgba(0,0,0,0.4);
      animation: pulse-glow 3s ease-in-out infinite;
      margin: 0 auto 18px;
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 50px rgba(245,197,24,0.4), 0 20px 40px rgba(0,0,0,0.4); }
      50% { box-shadow: 0 0 80px rgba(245,197,24,0.65), 0 20px 40px rgba(0,0,0,0.4); }
    }
    .brand {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #fff, var(--gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tagline {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 6px;
    }

    .login-card {
      width: 100%;
      background: var(--bg-glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 28px 24px;
      box-shadow: var(--shadow);
    }
    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.35);
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(245,197,24,0.2);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 15px 20px;
      border: none;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      color: #1a1a00;
      box-shadow: 0 8px 24px rgba(245,197,24,0.35);
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(245,197,24,0.5);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-ghost {
      background: var(--bg-glass);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.12); }
    .btn-sm {
      width: auto;
      padding: 8px 14px;
      font-size: 13px;
      border-radius: 12px;
    }
    .error-msg {
      color: var(--danger);
      font-size: 13px;
      margin-top: 12px;
      min-height: 18px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0 18px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .avatar-sm {
      width: 38px; height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--gold);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .avatar-sm:hover { transform: scale(1.08); }
    .avatar-placeholder {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      border: 2px solid var(--gold);
    }

    /* Bottom nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 10px 8px 22px;
      z-index: 100;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 14px;
      transition: all 0.2s;
    }
    .nav-item .icon { font-size: 22px; line-height: 1; }
    .nav-item.active {
      color: var(--gold);
      background: rgba(245,197,24,0.12);
    }
    .nav-item:hover:not(.active) { color: var(--text); }

    /* Cards & feed */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      backdrop-filter: blur(12px);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.3);
    }
    .moment-card {
      padding: 0;
      overflow: hidden;
    }
    .moment-img-wrap {
      position: relative;
      aspect-ratio: 1;
      background: #111;
      overflow: hidden;
    }
    .moment-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s;
    }
    .moment-card:hover .moment-img-wrap img { transform: scale(1.03); }
    .moment-meta {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .moment-user {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .moment-user img, .moment-user .avatar-placeholder {
      width: 36px; height: 36px;
      flex-shrink: 0;
    }
    .moment-user-info { min-width: 0; }
    .moment-user-info .name {
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .moment-user-info .caption {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .react-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 40px; height: 40px;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      flex-shrink: 0;
    }
    .react-btn:hover { transform: scale(1.15); background: rgba(245,197,24,0.15); }
    .react-btn.reacted { animation: heartBeat 0.4s; }
    @keyframes heartBeat {
      0% { transform: scale(1); }
      25% { transform: scale(1.3); }
      50% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }

    /* Friends grid */
    .friends-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .friend-item {
      text-align: center;
      cursor: pointer;
      padding: 12px 6px;
      border-radius: 16px;
      transition: background 0.2s;
    }
    .friend-item:hover { background: rgba(255,255,255,0.06); }
    .friend-item img, .friend-item .avatar-placeholder {
      width: 64px; height: 64px;
      border-radius: 50%;
      margin: 0 auto 8px;
      border: 2px solid var(--border);
      object-fit: cover;
    }
    .friend-item .name {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .friend-item .username {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Profile */
    .profile-hero {
      text-align: center;
      padding: 24px 0 20px;
    }
    .profile-avatar {
      width: 100px; height: 100px;
      border-radius: 50%;
      border: 3px solid var(--gold);
      object-fit: cover;
      margin: 0 auto 14px;
      box-shadow: 0 0 40px rgba(245,197,24,0.3);
    }
    .profile-name {
      font-size: 22px;
      font-weight: 800;
    }
    .profile-username {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 4px;
    }
    .profile-stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-top: 20px;
    }
    .stat { text-align: center; }
    .stat-val { font-size: 20px; font-weight: 800; color: var(--gold); }
    .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* Post form */
    .post-preview {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 20px;
      background: rgba(0,0,0,0.4);
      border: 2px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 16px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .post-preview:hover { border-color: var(--gold); }
    .post-preview img, .post-preview video {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .post-preview .placeholder {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }
    .post-preview .placeholder span { font-size: 40px; display: block; margin-bottom: 8px; }

    textarea {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.35);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      resize: none;
      outline: none;
      min-height: 80px;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: var(--gold); }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 14px 0;
      font-size: 14px;
    }
    .toggle {
      width: 48px; height: 28px;
      background: rgba(255,255,255,0.15);
      border-radius: 14px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle.on { background: var(--gold); }
    .toggle::after {
      content: '';
      position: absolute;
      width: 22px; height: 22px;
      background: #fff;
      border-radius: 50%;
      top: 3px; left: 3px;
      transition: transform 0.2s;
    }
    .toggle.on::after { transform: translateX(20px); }

    /* Chat */
    .chat-list-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 16px;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 4px;
    }
    .chat-list-item:hover { background: rgba(255,255,255,0.06); }
    .chat-list-item img, .chat-list-item .avatar-placeholder {
      width: 48px; height: 48px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }
    .chat-preview { flex: 1; min-width: 0; }
    .chat-preview .name { font-weight: 700; font-size: 14px; }
    .chat-preview .snippet {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Loading */
    .loader {
      display: flex;
      justify-content: center;
      padding: 40px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }

    /* Toast */
    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(20,20,30,0.95);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 22px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      z-index: 999;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
      max-width: 90%;
      text-align: center;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--danger); }

    /* Search bar */
    .search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .search-bar input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.35);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .search-bar input:focus { border-color: var(--gold); }

    /* Responsive */
    @media (min-width: 500px) {
      body { background: #050508; }
      .app {
        margin: 20px auto;
        min-height: calc(100vh - 40px);
        border-radius: 28px;
        border: 1px solid var(--border);
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      }
      .bottom-nav { border-radius: 0 0 28px 28px; }
    }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="app">
    <!-- LOGIN -->
    <div id="login-screen" class="screen active">
      <div class="logo-wrap">
        <div class="logo">💛</div>
        <div class="brand">Locket Tqd</div>
        <div class="tagline">Powered by locketlam · Full API</div>
      </div>
      <div class="login-card">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="email@gmail.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button class="btn btn-primary" id="login-btn" onclick="doLogin()">
          <span id="login-btn-text">Đăng nhập</span>
        </button>
        <div class="error-msg" id="login-error"></div>
      </div>
    </div>

    <!-- FEED -->
    <div id="feed-screen" class="screen">
      <div class="header">
        <h1>💛 Feed</h1>
        <div class="header-actions">
          <button class="btn btn-ghost btn-sm" onclick="loadFeed()">↻</button>
        </div>
      </div>
      <div id="feed-content">
        <div class="loader"><div class="spinner"></div></div>
      </div>
    </div>

    <!-- FRIENDS -->
    <div id="friends-screen" class="screen">
      <div class="header">
        <h1>Bạn bè</h1>
      </div>
      <div class="search-bar">
        <input type="text" id="friend-search" placeholder="Tìm username..." />
        <button class="btn btn-primary btn-sm" onclick="searchUser()">Tìm</button>
      </div>
      <div id="friends-content">
        <div class="loader"><div class="spinner"></div></div>
      </div>
    </div>

    <!-- POST -->
    <div id="post-screen" class="screen">
      <div class="header">
        <h1>Đăng Moment</h1>
      </div>
      <div class="post-preview" id="post-preview" onclick="document.getElementById('file-input').click()">
        <div class="placeholder">
          <span>📷</span>
          Chạm để chọn ảnh / video
        </div>
      </div>
      <input type="file" id="file-input" accept="image/*,video/*" hidden onchange="previewFile(this)" />
      <div class="form-group">
        <label>Caption</label>
        <textarea id="caption" placeholder="Viết gì đó..."></textarea>
      </div>
      <div class="toggle-row">
        <span>Chỉ mình tôi thấy</span>
        <div class="toggle" id="private-toggle" onclick="this.classList.toggle('on')"></div>
      </div>
      <button class="btn btn-primary" id="post-btn" onclick="doPost()">
        <span id="post-btn-text">Đăng ngay</span>
      </button>
    </div>

    <!-- CHAT -->
    <div id="chat-screen" class="screen">
      <div class="header">
        <h1>Tin nhắn</h1>
        <button class="btn btn-ghost btn-sm" onclick="loadConversations()">↻</button>
      </div>
      <div id="chat-content">
        <div class="loader"><div class="spinner"></div></div>
      </div>
    </div>

    <!-- PROFILE -->
    <div id="profile-screen" class="screen">
      <div class="header">
        <h1>Hồ sơ</h1>
        <button class="btn btn-ghost btn-sm" onclick="doLogout()">Đăng xuất</button>
      </div>
      <div id="profile-content">
        <div class="loader"><div class="spinner"></div></div>
      </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav" id="bottom-nav" style="display:none">
      <button class="nav-item active" data-screen="feed" onclick="showScreen('feed')">
        <span class="icon">🏠</span> Feed
      </button>
      <button class="nav-item" data-screen="friends" onclick="showScreen('friends')">
        <span class="icon">👥</span> Bạn bè
      </button>
      <button class="nav-item" data-screen="post" onclick="showScreen('post')">
        <span class="icon">➕</span> Đăng
      </button>
      <button class="nav-item" data-screen="chat" onclick="showScreen('chat')">
        <span class="icon">💬</span> Chat
      </button>
      <button class="nav-item" data-screen="profile" onclick="showScreen('profile')">
        <span class="icon">👤</span> Tôi
      </button>
    </nav>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = '';
    let currentUser = null;
    let selectedFile = null;

    // ---------- Helpers ----------
    function toast(msg, type = '') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show ' + type;
      setTimeout(() => el.classList.remove('show'), 2800);
    }

    function avatarHtml(url, name, sizeClass = '') {
      if (url) return `<img src="${url}" class="${sizeClass}" alt="" onerror="this.outerHTML=avatarPlaceholder('${name || '?'}','${sizeClass}')" />`;
      return avatarPlaceholder(name || '?', sizeClass);
    }
    function avatarPlaceholder(name, cls = '') {
      const letter = (name || '?')[0].toUpperCase();
      return `<div class="avatar-placeholder ${cls}">${letter}</div>`;
    }

    async function api(path, opts = {}) {
      const res = await fetch(API + path, {
        credentials: 'include',
        headers: opts.body instanceof FormData ? undefined : { 'Content-Type': 'application/json' },
        ...opts,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok && res.status === 401) {
        showLogin();
        throw new Error(data.error || 'Unauthorized');
      }
      return data;
    }

    // ---------- Screens ----------
    function showScreen(name) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(name + '-screen').classList.add('active');
      document.querySelectorAll('.nav-item').forEach(n => {
        n.classList.toggle('active', n.dataset.screen === name);
      });
      if (name === 'feed') loadFeed();
      if (name === 'friends') loadFriends();
      if (name === 'chat') loadConversations();
      if (name === 'profile') loadProfile();
    }

    function showLogin() {
      document.getElementById('bottom-nav').style.display = 'none';
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('login-screen').classList.add('active');
    }

    function showApp() {
      document.getElementById('bottom-nav').style.display = 'flex';
      showScreen('feed');
    }

    // ---------- Auth ----------
    async function checkAuth() {
      try {
        const data = await api('/api/status');
        if (data.authenticated) {
          currentUser = data;
          showApp();
        } else {
          showLogin();
        }
      } catch {
        showLogin();
      }
    }

    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');
      const btnText = document.getElementById('login-btn-text');

      if (!email || !password) {
        errEl.textContent = 'Vui lòng nhập email và mật khẩu';
        return;
      }

      btn.disabled = true;
      btnText.textContent = 'Đang đăng nhập...';
      errEl.textContent = '';

      try {
        const data = await api('/api/login', {
          method: 'POST',
          body: JSON.stringify({ email, password }),
        });
        if (data.ok) {
          currentUser = data;
          toast('Đăng nhập thành công! 💛', 'success');
          showApp();
        } else {
          errEl.textContent = data.error || 'Đăng nhập thất bại';
        }
      } catch (e) {
        errEl.textContent = e.message || 'Lỗi kết nối';
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Đăng nhập';
      }
    }

    async function doLogout() {
      await api('/api/logout', { method: 'POST' });
      currentUser = null;
      showLogin();
      toast('Đã đăng xuất');
    }

    // ---------- Feed ----------
    async function loadFeed() {
      const el = document.getElementById('feed-content');
      el.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
      try {
        const data = await api('/api/feed');
        if (!data.ok) throw new Error(data.error);
        const posts = data.posts || [];
        if (!posts.length) {
          el.innerHTML = `<div class="empty-state"><div class="icon">📸</div><p>Chưa có moment nào từ bạn bè</p></div>`;
          return;
        }
        el.innerHTML = posts.map(p => {
          const user = p.user || p.owner || {};
          const name = user.first_name || user.username || 'User';
          const avatar = user.profile_picture_url || user.avatar || '';
          const thumb = p.thumbnail_url || p.image_url || p.photo_url || '';
          const caption = p.caption || p.note || '';
          const uid = p.moment_uid || p.canonical_uid || p.uid || '';
          return `
            <div class="card moment-card">
              <div class="moment-img-wrap">
                ${thumb ? `<img src="${thumb}" alt="" loading="lazy" />` : '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#555;font-size:40px">📷</div>'}
              </div>
              <div class="moment-meta">
                <div class="moment-user">
                  ${avatarHtml(avatar, name)}
                  <div class="moment-user-info">
                    <div class="name">${esc(name)}</div>
                    <div class="caption">${esc(caption)}</div>
                  </div>
                </div>
                <button class="react-btn" onclick="reactMoment('${uid}', this)">❤️</button>
              </div>
            </div>`;
        }).join('');
      } catch (e) {
        el.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${esc(e.message)}</p></div>`;
      }
    }

    async function reactMoment(uid, btn) {
      if (!uid) return;
      try {
        await api('/api/moments/react', {
          method: 'POST',
          body: JSON.stringify({ moment_uid: uid, reaction: '❤️' }),
        });
        btn.classList.add('reacted');
        toast('Đã thả cảm xúc ❤️', 'success');
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    // ---------- Friends ----------
    async function loadFriends() {
      const el = document.getElementById('friends-content');
      el.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
      try {
        const data = await api('/api/friends');
        if (!data.ok) throw new Error(data.error);
        const friends = data.friends || [];
        if (!friends.length) {
          el.innerHTML = `<div class="empty-state"><div class="icon">👥</div><p>Chưa có bạn bè</p></div>`;
          return;
        }
        el.innerHTML = `<div class="friends-grid">${friends.map(f => {
          const name = f.first_name || f.username || '?';
          const uname = f.username ? '@' + f.username : '';
          const avatar = f.profile_picture_url || f.avatar || '';
          return `
            <div class="friend-item" onclick="viewUser('${f.username || f.uid}')">
              ${avatarHtml(avatar, name)}
              <div class="name">${esc(name)}</div>
              <div class="username">${esc(uname)}</div>
            </div>`;
        }).join('')}</div>`;
      } catch (e) {
        el.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${esc(e.message)}</p></div>`;
      }
    }

    async function searchUser() {
      const username = document.getElementById('friend-search').value.trim().replace('@', '');
      if (!username) return toast('Nhập username', 'error');
      try {
        const data = await api('/api/profile/username/' + encodeURIComponent(username));
        if (data.ok && data.profile) {
          const p = data.profile;
          toast(`Tìm thấy: ${p.first_name || p.username || username}`, 'success');
          if (confirm(`Gửi lời mời kết bạn tới @${username}?`)) {
            const r = await api('/api/friends/request', {
              method: 'POST',
              body: JSON.stringify({ username }),
            });
            toast(r.ok ? 'Đã gửi lời mời!' : (r.error || 'Lỗi'), r.ok ? 'success' : 'error');
          }
        } else {
          toast(data.error || 'Không tìm thấy', 'error');
        }
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    function viewUser(id) {
      toast('Xem profile: ' + id);
    }

    // ---------- Post ----------
    function previewFile(input) {
      const file = input.files[0];
      if (!file) return;
      selectedFile = file;
      const preview = document.getElementById('post-preview');
      const url = URL.createObjectURL(file);
      if (file.type.startsWith('video/')) {
        preview.innerHTML = `<video src="${url}" controls style="width:100%;height:100%;object-fit:cover"></video>`;
      } else {
        preview.innerHTML = `<img src="${url}" alt="preview" />`;
      }
    }

    async function doPost() {
      if (!selectedFile) return toast('Chọn ảnh hoặc video trước', 'error');
      const btn = document.getElementById('post-btn');
      const btnText = document.getElementById('post-btn-text');
      btn.disabled = true;
      btnText.textContent = 'Đang đăng...';

      const form = new FormData();
      if (selectedFile.type.startsWith('video/')) {
        form.append('video', selectedFile);
      } else {
        form.append('image', selectedFile);
      }
      form.append('caption', document.getElementById('caption').value);
      form.append('is_private', document.getElementById('private-toggle').classList.contains('on') ? 'true' : 'false');

      try {
        const data = await api('/api/moments/post', { method: 'POST', body: form });
        if (data.ok) {
          toast('Đăng moment thành công! 🎉', 'success');
          selectedFile = null;
          document.getElementById('caption').value = '';
          document.getElementById('post-preview').innerHTML = `<div class="placeholder"><span>📷</span>Chạm để chọn ảnh / video</div>`;
          document.getElementById('file-input').value = '';
          showScreen('feed');
        } else {
          toast(data.error || 'Đăng thất bại', 'error');
        }
      } catch (e) {
        toast(e.message, 'error');
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Đăng ngay';
      }
    }

    // ---------- Chat ----------
    async function loadConversations() {
      const el = document.getElementById('chat-content');
      el.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
      try {
        const data = await api('/api/chat/conversations');
        if (!data.ok) throw new Error(data.error);
        const convs = data.conversations || [];
        if (!convs.length) {
          el.innerHTML = `<div class="empty-state"><div class="icon">💬</div><p>Chưa có cuộc trò chuyện</p></div>`;
          return;
        }
        el.innerHTML = convs.map(c => {
          const peer = c.other_user || c.peer || c.user || {};
          const name = peer.first_name || peer.username || c.other_user_id || 'User';
          const avatar = peer.profile_picture_url || peer.avatar || '';
          const snippet = (c.last_message && (c.last_message.text || c.last_message.body)) || c.snippet || '';
          return `
            <div class="chat-list-item" onclick="openChat('${c.other_user_id || peer.uid || ''}')">
              ${avatarHtml(avatar, name)}
              <div class="chat-preview">
                <div class="name">${esc(name)}</div>
                <div class="snippet">${esc(snippet)}</div>
              </div>
            </div>`;
        }).join('');
      } catch (e) {
        el.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${esc(e.message)}</p></div>`;
      }
    }

    function openChat(uid) {
      if (!uid) return;
      toast('Chat với ' + uid + ' (mở rộng sau)');
    }

    // ---------- Profile ----------
    async function loadProfile() {
      const el = document.getElementById('profile-content');
      el.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
      try {
        const data = await api('/api/profile');
        if (!data.ok) throw new Error(data.error);
        const p = data.profile || {};
        const name = [p.first_name, p.last_name].filter(Boolean).join(' ') || p.username || 'Bạn';
        const avatar = p.profile_picture_url || p.avatar || '';
        el.innerHTML = `
          <div class="profile-hero">
            ${avatar ? `<img src="${avatar}" class="profile-avatar" alt="" />` : `<div class="profile-avatar" style="display:flex;align-items:center;justify-content:center;font-size:40px;background:linear-gradient(135deg,var(--gold),#8b5cf6)">${(name[0]||'?').toUpperCase()}</div>`}
            <div class="profile-name">${esc(name)}</div>
            <div class="profile-username">@${esc(p.username || '—')}</div>
            <div class="profile-stats">
              <div class="stat"><div class="stat-val">${p.friend_count ?? '—'}</div><div class="stat-label">Bạn bè</div></div>
              <div class="stat"><div class="stat-val">${p.moment_count ?? '—'}</div><div class="stat-label">Moments</div></div>
            </div>
          </div>
          <div class="card" style="margin-top:8px">
            <div style="font-size:13px;color:var(--text-muted);line-height:1.7">
              <div><b>UID:</b> ${esc(p.uid || currentUser?.uid || '—')}</div>
              <div><b>Email:</b> ${esc(currentUser?.email || '—')}</div>
            </div>
          </div>
        `;
      } catch (e) {
        el.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${esc(e.message)}</p></div>`;
      }
    }

    function esc(s) {
      if (!s) return '';
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    // Enter key login
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    // Boot
    checkAuth();
  </script>
</body>
</html>
